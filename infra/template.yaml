AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Step Functions PoC: SQS -> intake Lambda -> Step Functions (preprocess ->
  4-way Parallel). Each branch writes its own result to DynamoDB as soon as it
  finishes, so the fast branch is not blocked by the slow ones.

Parameters:
  Prefix:
    Type: String
    Default: sfeval
    Description: Name prefix for every resource in this stack.
  PreprocessSleepSeconds:
    Type: Number
    Default: 1
    Description: Stub sleep for the preprocess stage.
  TransformASleepSeconds:
    Type: Number
    Default: 1
    Description: Stub sleep for transform-a (the fast branch, 10s SLA).
  TransformBcdSleepSeconds:
    Type: Number
    Default: 8
    Description: Stub sleep for transform-b/c/d (the slow branches, 15s SLA).
  ResultTtlSeconds:
    Type: Number
    Default: 86400
    Description: How long result rows live before DynamoDB TTL removes them.
  StateMachineType:
    Type: String
    Default: STANDARD
    AllowedValues: [STANDARD, EXPRESS]
    Description: >-
      Workflow type. STANDARD keeps a service-side execution history and
      deduplicates executions by name; EXPRESS keeps neither and is observable
      only through CloudWatch Logs. Deploy a second stack with a different
      Prefix to compare the two side by side.

Resources:

  # ------------------------------------------------------------------
  # Result store
  # ------------------------------------------------------------------
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Prefix}-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: executionId
          AttributeType: S
        - AttributeName: taskName
          AttributeType: S
      KeySchema:
        - AttributeName: executionId
          KeyType: HASH
        - AttributeName: taskName
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expireAt
        Enabled: true

  # ------------------------------------------------------------------
  # Intake queue
  # ------------------------------------------------------------------
  # Two producers: SQS moves intake messages here after maxReceiveCount, and
  # the state machine sends a failure notice here when a task fails. The
  # status Lambda (below) consumes both and marks result rows as ERROR.
  IntakeDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Prefix}-intake-dlq'
      MessageRetentionPeriod: 345600

  IntakeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Prefix}-intake'
      # 6x the intake Lambda timeout, as recommended for SQS event sources.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IntakeDlq.Arn
        maxReceiveCount: 3

  # ------------------------------------------------------------------
  # Generic stub worker: sleeps N seconds and echoes back a fixed result
  # ------------------------------------------------------------------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-worker'
      RetentionInDays: 7

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Prefix}-worker-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # The worker persists its own result row, so the write permission lives
        # here rather than on the state machine role.
        - PolicyName: write-results
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ResultsTable.Arn

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub '${Prefix}-worker'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WorkerRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_SECONDS: !Ref ResultTtlSeconds
      Code:
        ZipFile: |
          import json
          import os
          import time

          import boto3

          RESULTS_TABLE = os.environ["RESULTS_TABLE"]
          TTL_SECONDS = int(os.environ["RESULT_TTL_SECONDS"])

          # Module scope: the client is reused across warm invocations.
          dynamodb = boto3.client("dynamodb")


          def handler(event, context):
              """Stub stage. Sleeps, writes its own result row, then echoes.

              The state machine only says *that* a stage runs; the result row's
              shape and timing are decided here. `emit` carries the row's
              identity -- when it is absent the stage writes nothing.
              """
              stage = event.get("stage", "unknown")
              sleep_seconds = float(event.get("sleepSeconds", 0))
              emit = event.get("emit")

              started = time.time()
              print(json.dumps({"msg": "stage.start", "stage": stage,
                                "sleepSeconds": sleep_seconds}))
              time.sleep(sleep_seconds)

              result = f"{stage}:ok"
              written_at = put_result(stage, result, emit) if emit else None

              finished = time.time()
              print(json.dumps({"msg": "stage.end", "stage": stage,
                                "elapsedMs": int((finished - started) * 1000),
                                "writtenAt": written_at}))

              return {
                  "stage": stage,
                  "result": result,
                  "input": event.get("input"),
                  "startedAt": int(started * 1000),
                  "finishedAt": int(finished * 1000),
                  "writtenAt": written_at,
              }


          def put_result(stage, result, emit):
              """Persist this stage's result. Returns the write time in epoch ms.

              Stamped just before the PutItem call, matching what the previous
              SDK-integration state recorded, so the numbers stay comparable.
              """
              enqueued_at = int(emit["enqueuedAt"])
              written_at = int(time.time() * 1000)

              item = {
                  "executionId": {"S": emit["executionId"]},
                  "taskName": {"S": stage},
                  "status": {"S": "SUCCEEDED"},
                  "enqueuedAt": {"N": str(enqueued_at)},
                  "writtenAt": {"N": str(written_at)},
                  "elapsedMs": {"N": str(written_at - enqueued_at)},
                  "result": {"S": result},
                  "expireAt": {"N": str(written_at // 1000 + TTL_SECONDS)},
              }
              if emit.get("messageId"):
                  item["messageId"] = {"S": emit["messageId"]}

              dynamodb.put_item(TableName=RESULTS_TABLE, Item=item)
              return written_at

  # ------------------------------------------------------------------
  # State machine
  # ------------------------------------------------------------------
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/states/${Prefix}-workflow'
      RetentionInDays: 7

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Prefix}-workflow-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-worker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt WorkerFunction.Arn
                  - !Sub '${WorkerFunction.Arn}:*'
        # Failure notices go to the intake DLQ. The state machine only says
        # where it failed; which rows become ERROR is the status Lambda's call.
        - PolicyName: notify-failure
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt IntakeDlq.Arn
        - PolicyName: vended-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Step Functions log delivery requires "*" on these actions.
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${Prefix}-workflow'
      StateMachineType: !Ref StateMachineType
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionSubstitutions:
        WorkerArn: !GetAtt WorkerFunction.Arn
        PreprocessSleep: !Ref PreprocessSleepSeconds
        TransformASleep: !Ref TransformASleepSeconds
        TransformBcdSleep: !Ref TransformBcdSleepSeconds
        DlqUrl: !Ref IntakeDlq
      Definition:
        QueryLanguage: JSONata
        Comment: >-
          Preprocess, then fan out to four independent transforms. This
          definition describes the flow only: each stage's worker writes its own
          result row to DynamoDB before it returns, so transform-a is readable
          long before the slow branches finish. When a task fails, a notice
          naming the failed stage goes to the intake DLQ; a failed transform
          does not stop the other branches.
        TimeoutSeconds: 300
        StartAt: Preprocess
        States:

          Preprocess:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Arguments:
              FunctionName: '${WorkerArn}'
              Payload:
                stage: preprocess
                sleepSeconds: '${PreprocessSleep}'
                input: '{% $states.input.body %}'
            # Re-invoke only on transient failures of the invoke call itself.
            # Permission errors (Lambda.AWSLambdaException) and missing functions
            # (Lambda.ResourceNotFoundException) never heal, so they fail at once.
            # Waits are fixed at 1s: with backoff the 15s SLA of transform-b/c/d
            # no longer holds when preprocess and the branch both exhaust retries.
            # No jitter: measured FULL jitter on a 1s interval waited either ~0s
            # or ~1s, so both retries often fired within 0.3s -- too soon for a
            # throttle to clear.
            Retry:
              - ErrorEquals:
                  - Lambda.TooManyRequestsException
                  - Lambda.ServiceException
                  - Lambda.SdkClientException
                IntervalSeconds: 1
                MaxAttempts: 2
                BackoffRate: 1
            # Anything left after Retry -- invoke failures and errors raised
            # inside the worker alike -- is reported and fails the execution.
            Catch:
              - ErrorEquals: [States.ALL]
                Assign:
                  failedStage: preprocess
                  failure: '{% $states.errorOutput %}'
                Next: NotifyFailure
            # No "emit" -- the preprocess stage writes nothing.
            # Carry the SLA clock into every branch as a variable.
            Assign:
              enqueuedAt: '{% $states.input.enqueuedAt %}'
              messageId: '{% $states.input.messageId %}'
            Output: '{% { "preprocessed": $states.result.Payload.result } %}'
            Next: FanOut

          FanOut:
            Type: Parallel
            Next: MarkComplete
            Branches:

              - StartAt: TransformA
                States:
                  TransformA:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Arguments:
                      FunctionName: '${WorkerArn}'
                      Payload:
                        stage: transform-a
                        sleepSeconds: '${TransformASleep}'
                        input: '{% $states.input.preprocessed %}'
                        # "emit" tells the worker to persist its result and
                        # identifies the row. The row's shape lives in the
                        # worker, not here.
                        emit:
                          executionId: '{% $states.context.Execution.Name %}'
                          enqueuedAt: '{% $enqueuedAt %}'
                    # Same retry policy as Preprocess.
                    Retry:
                      - ErrorEquals:
                          - Lambda.TooManyRequestsException
                          - Lambda.ServiceException
                          - Lambda.SdkClientException
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    # A failed transform is reported and its branch ends
                    # normally, so the other branches keep running and write
                    # their own rows. CheckBranches fails the execution later.
                    Catch:
                      - ErrorEquals: [States.ALL]
                        Output: '{% $states.errorOutput %}'
                        Next: NotifyA
                    Output: '{% { "taskName": "transform-a", "elapsedMs": $states.result.Payload.writtenAt - $enqueuedAt } %}'
                    End: true
                  NotifyA:
                    Type: Task
                    Resource: arn:aws:states:::sqs:sendMessage
                    Arguments:
                      QueueUrl: '${DlqUrl}'
                      MessageBody: '{% $string({ "messageId": $messageId, "executionId": $states.context.Execution.Name, "enqueuedAt": $enqueuedAt, "failedStage": "transform-a", "error": $states.input.Error, "cause": $states.input.Cause }) %}'
                    Retry:
                      - ErrorEquals: [States.ALL]
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    Output: '{% { "taskName": "transform-a", "error": $states.input.Error } %}'
                    End: true

              - StartAt: TransformB
                States:
                  TransformB:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Arguments:
                      FunctionName: '${WorkerArn}'
                      Payload:
                        stage: transform-b
                        sleepSeconds: '${TransformBcdSleep}'
                        input: '{% $states.input.preprocessed %}'
                        emit:
                          executionId: '{% $states.context.Execution.Name %}'
                          enqueuedAt: '{% $enqueuedAt %}'
                    # Same retry policy as Preprocess.
                    Retry:
                      - ErrorEquals:
                          - Lambda.TooManyRequestsException
                          - Lambda.ServiceException
                          - Lambda.SdkClientException
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    # Same as TransformA: report, then end the branch normally.
                    Catch:
                      - ErrorEquals: [States.ALL]
                        Output: '{% $states.errorOutput %}'
                        Next: NotifyB
                    Output: '{% { "taskName": "transform-b", "elapsedMs": $states.result.Payload.writtenAt - $enqueuedAt } %}'
                    End: true
                  NotifyB:
                    Type: Task
                    Resource: arn:aws:states:::sqs:sendMessage
                    Arguments:
                      QueueUrl: '${DlqUrl}'
                      MessageBody: '{% $string({ "messageId": $messageId, "executionId": $states.context.Execution.Name, "enqueuedAt": $enqueuedAt, "failedStage": "transform-b", "error": $states.input.Error, "cause": $states.input.Cause }) %}'
                    Retry:
                      - ErrorEquals: [States.ALL]
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    Output: '{% { "taskName": "transform-b", "error": $states.input.Error } %}'
                    End: true

              - StartAt: TransformC
                States:
                  TransformC:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Arguments:
                      FunctionName: '${WorkerArn}'
                      Payload:
                        stage: transform-c
                        sleepSeconds: '${TransformBcdSleep}'
                        input: '{% $states.input.preprocessed %}'
                        emit:
                          executionId: '{% $states.context.Execution.Name %}'
                          enqueuedAt: '{% $enqueuedAt %}'
                    # Same retry policy as Preprocess.
                    Retry:
                      - ErrorEquals:
                          - Lambda.TooManyRequestsException
                          - Lambda.ServiceException
                          - Lambda.SdkClientException
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    # Same as TransformA: report, then end the branch normally.
                    Catch:
                      - ErrorEquals: [States.ALL]
                        Output: '{% $states.errorOutput %}'
                        Next: NotifyC
                    Output: '{% { "taskName": "transform-c", "elapsedMs": $states.result.Payload.writtenAt - $enqueuedAt } %}'
                    End: true
                  NotifyC:
                    Type: Task
                    Resource: arn:aws:states:::sqs:sendMessage
                    Arguments:
                      QueueUrl: '${DlqUrl}'
                      MessageBody: '{% $string({ "messageId": $messageId, "executionId": $states.context.Execution.Name, "enqueuedAt": $enqueuedAt, "failedStage": "transform-c", "error": $states.input.Error, "cause": $states.input.Cause }) %}'
                    Retry:
                      - ErrorEquals: [States.ALL]
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    Output: '{% { "taskName": "transform-c", "error": $states.input.Error } %}'
                    End: true

              - StartAt: TransformD
                States:
                  TransformD:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Arguments:
                      FunctionName: '${WorkerArn}'
                      Payload:
                        stage: transform-d
                        sleepSeconds: '${TransformBcdSleep}'
                        input: '{% $states.input.preprocessed %}'
                        emit:
                          executionId: '{% $states.context.Execution.Name %}'
                          enqueuedAt: '{% $enqueuedAt %}'
                    # Same retry policy as Preprocess.
                    Retry:
                      - ErrorEquals:
                          - Lambda.TooManyRequestsException
                          - Lambda.ServiceException
                          - Lambda.SdkClientException
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    # Same as TransformA: report, then end the branch normally.
                    Catch:
                      - ErrorEquals: [States.ALL]
                        Output: '{% $states.errorOutput %}'
                        Next: NotifyD
                    Output: '{% { "taskName": "transform-d", "elapsedMs": $states.result.Payload.writtenAt - $enqueuedAt } %}'
                    End: true
                  NotifyD:
                    Type: Task
                    Resource: arn:aws:states:::sqs:sendMessage
                    Arguments:
                      QueueUrl: '${DlqUrl}'
                      MessageBody: '{% $string({ "messageId": $messageId, "executionId": $states.context.Execution.Name, "enqueuedAt": $enqueuedAt, "failedStage": "transform-d", "error": $states.input.Error, "cause": $states.input.Cause }) %}'
                    Retry:
                      - ErrorEquals: [States.ALL]
                        IntervalSeconds: 1
                        MaxAttempts: 2
                        BackoffRate: 1
                    Output: '{% { "taskName": "transform-d", "error": $states.input.Error } %}'
                    End: true

          MarkComplete:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Arguments:
              FunctionName: '${WorkerArn}'
              Payload:
                stage: zz-complete
                sleepSeconds: 0
                emit:
                  executionId: '{% $states.context.Execution.Name %}'
                  enqueuedAt: '{% $enqueuedAt %}'
                  messageId: '{% $messageId %}'
            # Same retry policy as Preprocess.
            Retry:
              - ErrorEquals:
                  - Lambda.TooManyRequestsException
                  - Lambda.ServiceException
                  - Lambda.SdkClientException
                IntervalSeconds: 1
                MaxAttempts: 2
                BackoffRate: 1
            Catch:
              - ErrorEquals: [States.ALL]
                Assign:
                  failedStage: zz-complete
                  failure: '{% $states.errorOutput %}'
                Next: NotifyFailure
            Output: '{% { "messageId": $messageId, "branches": $states.input } %}'
            Next: CheckBranches

          # Every branch has finished (and zz-complete is written) by now. If
          # any transform failed, end FAILED so it shows in the execution list.
          CheckBranches:
            Type: Choice
            Choices:
              - Condition: '{% $count($states.input.branches[$exists(error)]) > 0 %}'
                Next: BranchesFailed
            Default: Done

          BranchesFailed:
            Type: Fail
            Error: sfeval.BranchFailed
            Cause: '{% "failed: " & $join($states.input.branches[$exists(error)].taskName, ", ") %}'

          Done:
            Type: Succeed

          # Shared by Preprocess and MarkComplete; the Catch that led here set
          # $failedStage and $failure. Reads identity from the execution input
          # because Preprocess's own Assign never ran if it failed.
          NotifyFailure:
            Type: Task
            Resource: arn:aws:states:::sqs:sendMessage
            Arguments:
              QueueUrl: '${DlqUrl}'
              MessageBody: '{% $string({ "messageId": $states.context.Execution.Input.messageId, "executionId": $states.context.Execution.Name, "enqueuedAt": $states.context.Execution.Input.enqueuedAt, "failedStage": $failedStage, "error": $failure.Error, "cause": $failure.Cause }) %}'
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 1
                MaxAttempts: 2
                BackoffRate: 1
            Next: Failed

          Failed:
            Type: Fail
            Error: '{% $failure.Error %}'
            Cause: '{% $failure.Cause %}'

  # ------------------------------------------------------------------
  # Intake: SQS -> Lambda -> StartExecution
  # ------------------------------------------------------------------
  IntakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-intake'
      RetentionInDays: 7

  IntakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Prefix}-intake-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: consume-queue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IntakeQueue.Arn
        - PolicyName: start-workflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachine

  IntakeFunction:
    Type: AWS::Lambda::Function
    DependsOn: IntakeLogGroup
    Properties:
      FunctionName: !Sub '${Prefix}-intake'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IntakeRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref StateMachine
      Code:
        ZipFile: |
          import datetime
          import json
          import os
          import re

          import boto3

          sfn = boto3.client("stepfunctions")
          STATE_MACHINE_ARN = os.environ["STATE_MACHINE_ARN"]


          def handler(event, context):
              """Start one execution per SQS message, keyed by messageId."""
              failures = []
              invoked_at = datetime.datetime.now(datetime.timezone.utc)

              for record in event.get("Records", []):
                  message_id = record["messageId"]
                  try:
                      # SentTimestamp is the SLA clock: when the message landed in SQS.
                      enqueued_at = int(record["attributes"]["SentTimestamp"])
                      # Execution names allow a limited character set, max 80 chars.
                      name = re.sub(r"[^0-9a-zA-Z_-]", "-", message_id)[:80]
                      payload = {
                          "messageId": message_id,
                          "enqueuedAt": enqueued_at,
                          "body": record["body"],
                      }
                      try:
                          started = sfn.start_execution(
                              stateMachineArn=STATE_MACHINE_ARN,
                              name=name,
                              input=json.dumps(payload),
                          )
                          # StartExecution is idempotent for an identical
                          # name+input: it returns the original execution
                          # instead of raising. An older startDate means this
                          # message was already accepted.
                          replay = started["startDate"] < invoked_at
                          print(json.dumps({
                              "msg": "execution.deduplicated" if replay else "execution.started",
                              "messageId": message_id,
                              "enqueuedAt": enqueued_at,
                              "executionArn": started["executionArn"],
                          }))
                      except sfn.exceptions.ExecutionAlreadyExists:
                          # Same name but a different input: still a duplicate
                          # message id, so treat it as an accepted no-op.
                          print(json.dumps({
                              "msg": "execution.duplicate",
                              "messageId": message_id,
                              "name": name,
                          }))
                  except Exception as exc:  # noqa: BLE001 - report back to SQS
                      print(json.dumps({
                          "msg": "execution.failed",
                          "messageId": message_id,
                          "error": repr(exc),
                      }))
                      failures.append({"itemIdentifier": message_id})

              return {"batchItemFailures": failures}

  IntakeEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt IntakeQueue.Arn
      FunctionName: !GetAtt IntakeFunction.Arn
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ------------------------------------------------------------------
  # Status: DLQ -> Lambda -> mark result rows as ERROR
  # Stand-in for the real system's DLQ Lambda.
  # ------------------------------------------------------------------
  DlqLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Prefix}-dlq'
      RetentionInDays: 7

  DlqRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Prefix}-dlq-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: consume-dlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt IntakeDlq.Arn
        - PolicyName: mark-results
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ResultsTable.Arn

  DlqFunction:
    Type: AWS::Lambda::Function
    DependsOn: DlqLogGroup
    Properties:
      FunctionName: !Sub '${Prefix}-dlq'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DlqRole.Arn
      # Must stay below the DLQ's visibility timeout (30s default).
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          RESULT_TTL_SECONDS: !Ref ResultTtlSeconds
      Code:
        ZipFile: |
          import json
          import os
          import re
          import time

          import boto3

          RESULTS_TABLE = os.environ["RESULTS_TABLE"]
          TTL_SECONDS = int(os.environ["RESULT_TTL_SECONDS"])

          # Every row a run is expected to produce. A failure before the
          # transforms start leaves all of them unwritten, so all become ERROR.
          ALL_STAGES = ("transform-a", "transform-b", "transform-c",
                        "transform-d", "zz-complete")
          WHOLE_RUN = ("intake", "preprocess")

          dynamodb = boto3.client("dynamodb")


          def handler(event, context):
              failures = []
              for record in event.get("Records", []):
                  try:
                      notice = parse(record)
                      stages = (ALL_STAGES if notice["failedStage"] in WHOLE_RUN
                                else (notice["failedStage"],))
                      for stage in stages:
                          mark_error(notice, stage)
                      print(json.dumps({"msg": "status.error", **notice,
                                        "marked": list(stages)}))
                  except Exception as exc:  # noqa: BLE001 - report back to SQS
                      print(json.dumps({"msg": "status.failed",
                                        "messageId": record["messageId"],
                                        "error": repr(exc)}))
                      failures.append({"itemIdentifier": record["messageId"]})
              return {"batchItemFailures": failures}


          def parse(record):
              """Read a failure notice, keyed by values in the message body.

              The state machine sends a notice naming the failed stage. Anything
              else is an intake message SQS moved here after maxReceiveCount:
              StartExecution never succeeded, and SQS keeps the original
              messageId on the move.
              """
              try:
                  body = json.loads(record["body"])
              except ValueError:
                  body = None
              if isinstance(body, dict) and "failedStage" in body:
                  return {k: body.get(k) for k in ("messageId", "executionId",
                          "enqueuedAt", "failedStage", "error", "cause")}

              message_id = record["messageId"]
              return {
                  "messageId": message_id,
                  # Same naming rule as the intake Lambda.
                  "executionId": re.sub(r"[^0-9a-zA-Z_-]", "-", message_id)[:80],
                  "enqueuedAt": int(record["attributes"]["SentTimestamp"]),
                  "failedStage": "intake",
                  "error": "IntakeFailed",
                  "cause": "StartExecution did not succeed within maxReceiveCount",
              }


          def mark_error(notice, stage):
              now = int(time.time() * 1000)
              dynamodb.update_item(
                  TableName=RESULTS_TABLE,
                  Key={"executionId": {"S": notice["executionId"]},
                       "taskName": {"S": stage}},
                  UpdateExpression=(
                      "SET #status = :status, #error = :error, #cause = :cause,"
                      " #failedStage = :failedStage, #messageId = :messageId,"
                      " #enqueuedAt = :enqueuedAt, #updatedAt = :now,"
                      " #expireAt = :expireAt"),
                  ExpressionAttributeNames={
                      f"#{k}": k for k in ("status", "error", "cause",
                      "failedStage", "messageId", "enqueuedAt", "updatedAt",
                      "expireAt")},
                  ExpressionAttributeValues={
                      ":status": {"S": "ERROR"},
                      ":error": {"S": str(notice["error"])},
                      ":cause": {"S": str(notice["cause"])},
                      ":failedStage": {"S": notice["failedStage"]},
                      ":messageId": {"S": str(notice["messageId"])},
                      ":enqueuedAt": {"N": str(int(notice["enqueuedAt"]))},
                      ":now": {"N": str(now)},
                      ":expireAt": {"N": str(now // 1000 + TTL_SECONDS)},
                  },
              )

  DlqEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt IntakeDlq.Arn
      FunctionName: !GetAtt DlqFunction.Arn
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  QueueUrl:
    Description: Send test messages here.
    Value: !Ref IntakeQueue
  QueueArn:
    Value: !GetAtt IntakeQueue.Arn
  DlqUrl:
    Value: !Ref IntakeDlq
  ResultsTableName:
    Value: !Ref ResultsTable
  StateMachineArn:
    Value: !Ref StateMachine
  StateMachineLogGroup:
    Value: !Ref StateMachineLogGroup
  IntakeFunctionName:
    Value: !Ref IntakeFunction
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  DlqFunctionName:
    Value: !Ref DlqFunction
